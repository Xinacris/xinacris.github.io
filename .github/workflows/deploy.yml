name: Deploy to GitHub Papers

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Add 404.html and extensionless route files
        run: |
          cp build/client/__spa-fallback.html build/client/404.html
          # Serve /projects from projects.html instead of 301-ing to /projects/
          for f in build/client/*/index.html; do
            d=$(dirname "$f"); [ "$(basename "$d")" = assets ] || cp "$f" "$d.html"
          done

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/client
          branch: gh-pages
