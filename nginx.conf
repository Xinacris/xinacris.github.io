server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change; cache them hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Prerendered routes live at /<route>/index.html. Anything else gets the
    # SPA fallback shell (with a 404 status) so client-side routing still works.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /__spa-fallback.html;
    location = /__spa-fallback.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
